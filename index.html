<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0b"/>
<title>Physique du rôle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#09090b;--card:#151518;--line:#2a2a30;--gold:#d2ac5b;--text:#fff;--muted:#a5a5ad}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
.app{max-width:760px;margin:auto;padding:20px 16px 110px}
.hidden{display:none!important}
.brand{font-size:34px;font-weight:900}
.gold{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
input,select{width:100%;background:#0d0d10;border:1px solid #35353b;border-radius:13px;color:#fff;padding:13px;margin-top:7px}
.btn{border:0;border-radius:13px;padding:13px 15px;font-weight:800}
.primary{background:var(--gold);color:#111}
.secondary{background:#222228;color:#fff}
.danger{background:#401a22;color:#ff9cac}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric b{font-size:26px;display:block;margin-top:6px}
.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:38px;height:38px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold)}
.task.done .check{background:var(--gold);color:#111}
.task main{flex:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#101014ee;border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:#888;padding:8px 2px}
.nav button.active{color:var(--gold)}
.page{display:none}
.page.active{display:block}
.modal{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
.modal.show{display:flex}
.sheet{width:min(100%,720px);background:#17171b;border:1px solid #34343a;border-radius:24px 24px 16px 16px;padding:18px;max-height:90vh;overflow:auto}
.item{padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.thumb{width:74px;height:74px;border-radius:12px;object-fit:cover;background:#222}
.auth{max-width:460px;margin:8vh auto}
.hero{padding:24px 0}
.hero h1{font-size:42px;margin:0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#24242a;border:1px solid #3b3b42;padding:10px 16px;border-radius:999px;display:none;z-index:30}
.toast.show{display:block}
@media(max-width:520px){.grid{grid-template-columns:1fr}.brand{font-size:30px}}
</style>
</head>
<body>
<div id="auth" class="app auth">
  <div class="hero"><div class="brand">Physique du <span class="gold">rôle</span></div><p class="muted">Tu día, tus hábitos y tu progreso.</p></div>
  <div class="card">
    <h2>Ingresar</h2>
    <label>Email<input id="email" type="email" autocomplete="email"/></label>
    <label>Contraseña<input id="password" type="password" autocomplete="current-password"/></label>
    <div class="row" style="margin-top:14px"><button class="btn primary" onclick="login()">Ingresar</button><button class="btn secondary" onclick="signup()">Crear cuenta</button></div>
    <p id="authMsg" class="muted"></p>
  </div>
</div>

<div id="main" class="app hidden">
  <section id="inicio" class="page active">
    <div class="row between"><div><div class="brand">Mi día</div><div id="todayLabel" class="gold"></div></div><button class="btn secondary" onclick="logout()">Salir</button></div>
    <div class="grid">
      <div class="card metric"><span class="muted">Consumido</span><b id="sumKcal">0 kcal</b><small id="sumMacros" class="muted">P 0 · C 0 · G 0</small></div>
      <div class="card metric"><span class="muted">Actividad</span><b id="sumActivity">0 kcal</b><small class="muted">Carga manual por ahora</small></div>
      <div class="card metric"><span class="muted">Agua</span><b id="sumWater">0 ml</b><button class="btn secondary" style="margin-top:10px" onclick="addWater(500)">+500 ml</button></div>
      <div class="card metric"><span class="muted">Peso</span><b id="sumWeight">—</b><button class="btn secondary" style="margin-top:10px" onclick="openWeight()">Registrar</button></div>
    </div>
    <div class="card"><h2>Tareas de hoy</h2><div id="tasks"></div></div>
  </section>

  <section id="alimentacion" class="page"><div class="row between"><div class="brand">Alimentación</div><button class="btn primary" onclick="openMeal()">+ Comida</button></div><div id="mealList" class="card"></div></section>
  <section id="entreno" class="page"><div class="row between"><div class="brand">Entreno</div><button class="btn primary" onclick="openWorkout()">+ Entreno</button></div><div id="workoutList" class="card"></div></section>
  <section id="progreso" class="page"><div class="row between"><div class="brand">Progreso</div><button class="btn primary" onclick="openWeight()">+ Peso</button></div><div id="weightList" class="card"></div></section>
  <section id="perfil" class="page"><div class="brand">Perfil</div><div class="card"><h3>Configuración</h3><label>Objetivo de agua (ml)<input id="waterGoal" type="number" value="3000"/></label><button class="btn primary" style="margin-top:12px" onclick="saveProfile()">Guardar</button></div></section>
</div>

<nav id="nav" class="nav hidden">
<button class="active" data-page="inicio">⌂<br><small>Inicio</small></button>
<button data-page="alimentacion">🍴<br><small>Alimentación</small></button>
<button data-page="entreno">🏋<br><small>Entreno</small></button>
<button data-page="progreso">↗<br><small>Progreso</small></button>
<button data-page="perfil">●<br><small>Perfil</small></button>
</nav>

<div id="mealModal" class="modal"><div class="sheet"><h2>Registrar comida</h2><label>Tipo<select id="mealType"><option value="breakfast">Desayuno</option><option value="lunch" selected>Almuerzo</option><option value="snack">Merienda</option><option value="pre_workout">Pre-entreno</option><option value="dinner">Cena</option><option value="other">Otra</option></select></label><label>Foto<input id="mealPhoto" type="file" accept="image/*" capture="environment"/></label><label>Descripción<input id="mealDesc"/></label><div class="grid"><label>Calorías<input id="mealK" type="number" value="0"/></label><label>Proteínas<input id="mealP" type="number" value="0"/></label><label>Carbohidratos<input id="mealC" type="number" value="0"/></label><label>Grasas<input id="mealF" type="number" value="0"/></label></div><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveMeal()">Guardar</button><button class="btn secondary" onclick="closeModal('mealModal')">Cancelar</button></div></div></div>
<div id="workoutModal" class="modal"><div class="sheet"><h2>Registrar entrenamiento</h2><label>Actividad<select id="workoutType"><option>Gimnasio</option><option>Running</option><option>Tenis</option><option>Fútbol</option><option>Bicicleta</option><option>Descanso</option></select></label><label>Duración (min)<input id="workoutMin" type="number" value="60"/></label><label>Calorías activas<input id="workoutKcal" type="number" value="0"/></label><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveWorkout()">Guardar</button><button class="btn secondary" onclick="closeModal('workoutModal')">Cancelar</button></div></div></div>
<div id="weightModal" class="modal"><div class="sheet"><h2>Registrar peso</h2><label>Peso (kg)<input id="weightValue" type="number" step="0.1"/></label><div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveWeight()">Guardar</button><button class="btn secondary" onclick="closeModal('weightModal')">Cancelar</button></div></div></div>
<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL='https://xmsskgmlhwahjxkdheyk.supabase.co';
const SUPABASE_KEY='sb_publishable_XObYr-_94MHmPOcuTIp9AA_NM4ROwr_';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, profile=null;
const $=id=>document.getElementById(id), dayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.toISOString()}, dayEnd=()=>{const d=new Date();d.setHours(23,59,59,999);return d.toISOString()};
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function closeModal(id){$(id).classList.remove('show')} function openMeal(){$('mealModal').classList.add('show')} function openWorkout(){$('workoutModal').classList.add('show')} function openWeight(){$('weightModal').classList.add('show')}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('authMsg').textContent=error?error.message:'Ingresando…'}
async function signup(){const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('authMsg').textContent=error?error.message:'Cuenta creada. Revisá tu correo si Supabase solicita confirmación.'}
async function logout(){await sb.auth.signOut()}
async function ensureProfile(){let {data}=await sb.from('profiles').select('*').eq('user_id',user.id).maybeSingle();if(!data){await sb.from('profiles').insert({user_id:user.id,display_name:user.email?.split('@')[0]||'Usuario'});({data}=await sb.from('profiles').select('*').eq('user_id',user.id).single())}profile=data;$('waterGoal').value=profile.water_goal_ml||3000}
async function saveProfile(){const water_goal_ml=+$('waterGoal').value;await sb.from('profiles').update({water_goal_ml,updated_at:new Date().toISOString()}).eq('user_id',user.id);profile.water_goal_ml=water_goal_ml;toast('Perfil guardado');refresh()}
async function uploadMealImage(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('meal-images').upload(path,file,{upsert:false});if(error)throw error;return path}
async function saveMeal(){try{const file=$('mealPhoto').files[0],image_path=await uploadMealImage(file);const {error}=await sb.from('meals').insert({user_id:user.id,meal_type:$('mealType').value,description:$('mealDesc').value||'Comida',calories:+$('mealK').value,protein_g:+$('mealP').value,carbs_g:+$('mealC').value,fat_g:+$('mealF').value,image_path,analysis_status:'manual'});if(error)throw error;closeModal('mealModal');toast('Comida guardada');['mealDesc','mealK','mealP','mealC','mealF'].forEach(id=>$(id).value=id==='mealDesc'?'':'0');$('mealPhoto').value='';refresh()}catch(e){toast(e.message)}}
async function saveWorkout(){const {error}=await sb.from('workouts').insert({user_id:user.id,activity_type:$('workoutType').value,duration_minutes:+$('workoutMin').value,active_calories:+$('workoutKcal').value,source:'manual'});if(error)return toast(error.message);closeModal('workoutModal');toast('Entrenamiento guardado');refresh()}
async function saveWeight(){const {error}=await sb.from('weights').insert({user_id:user.id,weight_kg:+$('weightValue').value});if(error)return toast(error.message);closeModal('weightModal');toast('Peso guardado');refresh()}
async function addWater(amount){const {error}=await sb.from('water_entries').insert({user_id:user.id,amount_ml:amount});if(error)return toast(error.message);toast(`+${amount} ml`);refresh()}
async function deleteRow(table,id){await sb.from(table).delete().eq('id',id);refresh()}
async function signedImage(path){if(!path)return null;const {data}=await sb.storage.from('meal-images').createSignedUrl(path,3600);return data?.signedUrl||null}
async function refresh(){if(!user)return;const [{data:meals},{data:workouts},{data:weights},{data:water}]=await Promise.all([
 sb.from('meals').select('*').gte('eaten_at',dayStart()).lte('eaten_at',dayEnd()).order('eaten_at',{ascending:false}),
 sb.from('workouts').select('*').gte('started_at',dayStart()).lte('started_at',dayEnd()).order('started_at',{ascending:false}),
 sb.from('weights').select('*').order('measured_at',{ascending:false}).limit(20),
 sb.from('water_entries').select('*').gte('consumed_at',dayStart()).lte('consumed_at',dayEnd())]);
 const sum=(meals||[]).reduce((a,m)=>({k:a.k+m.calories,p:a.p+Number(m.protein_g),c:a.c+Number(m.carbs_g),f:a.f+Number(m.fat_g)}),{k:0,p:0,c:0,f:0});
 $('sumKcal').textContent=`${sum.k} kcal`;$('sumMacros').textContent=`P ${sum.p} · C ${sum.c} · G ${sum.f}`;$('sumActivity').textContent=`${(workouts||[]).reduce((a,w)=>a+w.active_calories,0)} kcal`;$('sumWater').textContent=`${(water||[]).reduce((a,w)=>a+w.amount_ml,0)} / ${profile?.water_goal_ml||3000} ml`;$('sumWeight').textContent=weights?.[0]?`${weights[0].weight_kg} kg`:'—';
 const mealTypes={breakfast:'Desayuno',lunch:'Almuerzo',snack:'Merienda',pre_workout:'Pre-entreno',dinner:'Cena',other:'Otra'};
 const tasks=[['lunch','Almuerzo'],['pre_workout','Pre-entreno'],['dinner','Cena'],['water','Agua'],['workout','Entrenamiento']];
 const waterTotal=(water||[]).reduce((a,w)=>a+w.amount_ml,0), workoutDone=(workouts||[]).length>0;
 $('tasks').innerHTML=tasks.map(([key,label])=>{let done=key==='water'?waterTotal>=(profile?.water_goal_ml||3000):key==='workout'?workoutDone:(meals||[]).some(m=>m.meal_type===key);return `<div class="task ${done?'done':''}"><div class="check">${done?'✓':'•'}</div><main><b>${label}</b><small class="muted">${done?'Completado':'Pendiente'}</small></main></div>`}).join('');
 $('mealList').innerHTML=(meals||[]).length?'Cargando…':'<div class="muted">Sin comidas hoy.</div>';
 const mealHtml=[];for(const m of meals||[]){const url=await signedImage(m.image_path);mealHtml.push(`<div class="item row">${url?`<img class="thumb" src="${url}">`:''}<main style="flex:1"><b>${mealTypes[m.meal_type]||m.meal_type}</b><div>${m.description}</div><small class="muted">${m.calories} kcal · P ${m.protein_g} · C ${m.carbs_g} · G ${m.fat_g}</small></main><button class="btn danger" onclick="deleteRow('meals','${m.id}')">Borrar</button></div>`)}$('mealList').innerHTML=mealHtml.join('')||'<div class="muted">Sin comidas hoy.</div>';
 $('workoutList').innerHTML=(workouts||[]).map(w=>`<div class="item row"><main style="flex:1"><b>${w.activity_type}</b><div class="muted">${w.duration_minutes} min · ${w.active_calories} kcal</div></main><button class="btn danger" onclick="deleteRow('workouts','${w.id}')">Borrar</button></div>`).join('')||'<div class="muted">Sin entrenamientos hoy.</div>';
 $('weightList').innerHTML=(weights||[]).map(w=>`<div class="item"><b>${w.weight_kg} kg</b><div class="muted">${new Date(w.measured_at).toLocaleDateString('es-AR')}</div></div>`).join('')||'<div class="muted">Sin registros.</div>';
}
async function showApp(session){user=session?.user||null;if(!user){$('auth').classList.remove('hidden');$('main').classList.add('hidden');$('nav').classList.add('hidden');return}$('auth').classList.add('hidden');$('main').classList.remove('hidden');$('nav').classList.remove('hidden');await ensureProfile();refresh()}
sb.auth.onAuthStateChange((_e,session)=>showApp(session));sb.auth.getSession().then(({data})=>showApp(data.session));
$('todayLabel').textContent=new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.page).classList.add('active');scrollTo(0,0)});
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m.id)});
</script>
</body>
</html>
